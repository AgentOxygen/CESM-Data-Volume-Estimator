# rof history fields. Seeded from reference/lens2output200129.csv, then
# maintained by hand. See README.md -> "Add or correct a variable".
#
#   dims    copy verbatim from `ncdump -h`, in order, including `time`.
#   streams <stream>: <tier>  -- which LENS2 preset the variable belongs to.
#
# A variable may appear twice with DIFFERENT dims (CTSM writes some fields
# gridded in one stream and as subgrid vectors in another). Keep them separate.

horiz_dims: [lat, lon]
dtype_bytes: 4

variables:
- name: DIRECT_DISCHARGE_TO_OCEAN_ICE
  dims: [time, lat, lon]
  streams: {month_1: std}
  long_name: 'MOSART direct discharge into ocean: ICE'
  units: m3/s
- name: DIRECT_DISCHARGE_TO_OCEAN_LIQ
  dims: [time, lat, lon]
  streams: {month_1: std}
  long_name: 'MOSART direct discharge into ocean: LIQ'
  units: m3/s
- name: RIVER_DISCHARGE_OVER_LAND_ICE
  dims: [time, lat, lon]
  streams: {month_1: std}
  long_name: 'MOSART river basin flow: ICE'
  units: m3/s
- name: RIVER_DISCHARGE_OVER_LAND_LIQ
  dims: [time, lat, lon]
  streams: {day_1: MOAR, hour_6: MOAR, month_1: std}
  long_name: 'MOSART river basin flow: LIQ'
  units: m3/s
- name: TOTAL_DISCHARGE_TO_OCEAN_ICE
  dims: [time, lat, lon]
  streams: {month_1: std}
  long_name: 'MOSART total discharge into ocean: ICE'
  units: m3/s
- name: TOTAL_DISCHARGE_TO_OCEAN_LIQ
  dims: [time, lat, lon]
  streams: {hour_6: MOAR, month_1: std}
  long_name: 'MOSART total discharge into ocean: LIQ'
  units: m3/s

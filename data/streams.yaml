# Output streams, named as CESM names them: <unit>_<count>.
#
# samples_per_year assumes the CESM 365-day no-leap calendar.
#
# NOTE: volumes are reported as RAW UNCOMPRESSED bytes. If your run writes
# compressed netCDF (deflate/zstd), actual output will be smaller. See
# README -> "What this tool does not model".

month_1: {samples_per_year: 12,   label: monthly}
day_5:   {samples_per_year: 73,   label: 5-day}
day_1:   {samples_per_year: 365,  label: daily}
hour_6:  {samples_per_year: 1460, label: 6-hourly}
hour_3:  {samples_per_year: 2920, label: 3-hourly}
hour_1:  {samples_per_year: 8760, label: hourly}
year_1:  {samples_per_year: 1,    label: annual mean}
day_365: {samples_per_year: 1,    label: annual (day-365 snapshot)}

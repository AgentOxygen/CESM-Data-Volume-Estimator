# ocn history fields. Seeded from reference/lens2output200129.csv, then
# maintained by hand. See README.md -> "Add or correct a variable".
#
#   dims    copy verbatim from `ncdump -h`, in order, including `time`.
#   streams <stream>: <tier>  -- which LENS2 preset the variable belongs to.
#
# A variable may appear twice with DIFFERENT dims (CTSM writes some fields
# gridded in one stream and as subgrid vectors in another). Keep them separate.

horiz_dims: [nlat, nlon]
dtype_bytes: 4

# This file is POP2 (CESM2 LENS2). CESM3's ocean is MOM6, a different model
# with no overlapping variable names -- not "unverified," confirmed wrong.
# `cesm2-only` says so. If a MOM6 catalogue is ever added, it does not belong
# in this file: it is a different component's output, not a correction to
# this one.
verified: cesm2-only


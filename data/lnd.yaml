# lnd history fields. Seeded from reference/lens2output200129.csv, then
# maintained by hand. See README.md -> "Add or correct a variable".
#
#   dims    copy verbatim from `ncdump -h`, in order, including `time`.
#   streams <stream>: <tier>  -- which LENS2 preset the variable belongs to.
#
# A variable may appear twice with DIFFERENT dims (CTSM writes some fields
# gridded in one stream and as subgrid vectors in another). Keep them separate.

horiz_dims: [lat, lon]
dtype_bytes: 4

# This whole file is seeded from LENS2 (CESM2). A name existing here is not
# evidence it exists in CESM3 -- nobody has checked, for any of these
# variables, against a real CESM3 history file. `unknown` says so; set a
# variable to `verified: cesm3` only once one actually has been checked.
verified: unknown

variables:
- name: ACTUAL_IMMOB
  verified: cesm3
  dims: [time, lat, lon]
  streams: {month_1: std}
  long_name: actual N immobilization
  units: gN/m^2/s
- name: AGNPP
  verified: cesm3
  dims: [time, lat, lon]
  streams: {month_1: std}
  long_name: aboveground NPP
  units: gC/m^2/s
- name: AGNPP
  verified: cesm3

# The grids the volume estimate offers: how many horizontal cells each component writes, and the size
# of every other dimension its fields use (the dimension names are the ones in the CESM3 source records).
#
# A history field is priced as  4 bytes x cells x product of its dimension sizes  per time sample.
# CTSM fields are priced as gridded output (cells), whatever their native subgrid level, because that is
# what the exported namelist writes. A dimension missing here, or set to null, leaves that line unpriced.
# `lev` and `ilev` are not listed: they come from data/vertical.yaml.
#
# Where each number comes from is noted on its line; UNVERIFIED means not yet checked against a real
# history file's `ncdump -h`.

grids:

  ne30pg3_t233:
    label: ne30pg3_t233 - CAM-SE ~1 deg atm/lnd, tx2_3v3 ocn/ice (CESM3 default)
    atm:
      cells: 48600           # 6 * ne^2 * pg^2 = 6 * 30^2 * 3^2 (ne30np4 is a different grid with 48602)
    lnd:
      cells: 48600           # CTSM writes the atmosphere's columns
      sizes:                 # CTSM constants (UNVERIFIED)
        levgrnd: 25
        levsoi: 20
        levdcmp: 25
        levlak: 10
        natpft: 15
        cft: 2
        ltype: 9
        glc_nec: 10
        elevclas: 11
        nvegwcs: 4
    ocn:
      cells: 259200          # NIGLOBAL x NJGLOBAL = 540 x 480 for tx2_3v2/tx2_3v3 (mom/param_templates/json/MOM_input.json)
      sizes: {zl: 75, zi: 76}   # NK = 75 for the hycom1 vertical grid that oi%tx2_3v3 uses (config_component.xml); zi = zl + 1
    ice:
      cells: 259200          # CICE shares the ocean grid
      sizes: {nc: 5}         # CICE ice-thickness categories (UNVERIFIED)
    rof:
      cells: 259200          # MOSART r05, 360 x 720 (UNVERIFIED)
    glc: null                # the baseline compset has a data ice sheet: CISM does not run
